<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Outer glowing subtle ring -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Globe / World Wireframe Grid -->
  <g transform="translate(64, 64)" filter="url(#shadow)">
    <!-- Globe Circle -->
    <circle r="36" fill="#0f172a" fill-opacity="0.35" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
    
    <!-- Longitudes & Latitudes -->
    <ellipse rx="18" ry="36" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-opacity="0.8"/>
    <ellipse rx="36" ry="14" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-opacity="0.7"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#93c5fd" stroke-width="1.8" stroke-opacity="0.8"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#93c5fd" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- eSIM Microchip & 5G Signal Wave overlay -->
    <g transform="translate(6, 6)">
      <!-- Mini eSIM Chip Badge -->
      <rect x="0" y="0" width="26" height="24" rx="5" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
      <!-- Chip Core lines -->
      <rect x="5" y="5" width="16" height="14" rx="2" fill="#0284c7"/>
      <path d="M10 5 v14 M16 5 v14 M5 10 h16 M5 14 h16" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Gold Dot for eSIM Connection -->
      <circle cx="21" cy="4" r="3.5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Signal Waves in Top Left -->
    <path d="M-18 -18 A 28 28 0 0 1 -4 -32" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 -12 A 18 18 0 0 1 -2 -22" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
